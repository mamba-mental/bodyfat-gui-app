name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [published]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend

jobs:
  # Security and code quality checks
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level moderate

      - name: Check for known vulnerabilities
        run: npx audit-ci --moderate

  # Frontend testing and linting
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Test build artifacts
        run: |
          test -d .next/standalone
          test -d .next/static
          echo "Build artifacts verified"

  # Backend testing
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black flake8

      - name: Run code formatting check
        run: black --check .

      - name: Run linting
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test API startup
        run: |
          timeout 30s python main.py &
          sleep 10
          curl -f http://localhost:8000/health || exit 1

  # Container security scanning
  container-security:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend image for scanning
        run: |
          docker build -t local/frontend:scan .

      - name: Build backend image for scanning
        run: |
          docker build -t local/backend:scan ./python-api

      - name: Run Trivy vulnerability scanner - Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/frontend:scan'
          format: 'sarif'
          output: 'trivy-frontend.sarif'

      - name: Run Trivy vulnerability scanner - Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/backend:scan'
          format: 'sarif'
          output: 'trivy-backend.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: '.'

  # Build and push container images
  build-images:
    runs-on: ubuntu-latest
    needs: [security-audit, frontend-test, backend-test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    outputs:
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-digest: ${{ steps.build-frontend.outputs.digest }}
      backend-digest: ${{ steps.build-backend.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./python-api
          file: ./python-api/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Integration testing with built images
  integration-test:
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test environment
        run: |
          cat > docker-compose.test.yml << EOF
          version: '3.8'
          services:
            frontend:
              image: ${{ needs.build-images.outputs.frontend-image }}
              ports:
                - "3000:3000"
              environment:
                - NODE_ENV=production
                - NEXT_PUBLIC_PYTHON_API_URL=http://backend:8000
              depends_on:
                - backend
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
                interval: 30s
                timeout: 10s
                retries: 3
            
            backend:
              image: ${{ needs.build-images.outputs.backend-image }}
              ports:
                - "8000:8000"
              environment:
                - PYTHONUNBUFFERED=1
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
          EOF

      - name: Run integration tests
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30
          
          # Test frontend health
          curl -f http://localhost:3000/api/health
          
          # Test backend health
          curl -f http://localhost:8000/health
          
          # Test API integration
          curl -X POST http://localhost:8000/calculate \
            -H "Content-Type: application/json" \
            -d '{"current_weight": 180, "goal_weight": 170, "current_bf": 20, "goal_bf": 15}'
          
          docker-compose -f docker-compose.test.yml down

  # Deployment to production (manual trigger or release)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-images, integration-test]
    if: github.event_name == 'release' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[deploy]'))
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Production deployment would happen here"
          echo "Frontend image: ${{ needs.build-images.outputs.frontend-image }}"
          echo "Backend image: ${{ needs.build-images.outputs.backend-image }}"
          echo "This would typically involve:"
          echo "- Updating production docker-compose.yml with new image tags"
          echo "- Running docker-compose pull && docker-compose up -d"
          echo "- Health checks and rollback capability"

      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Production Deployment Summary
          
          **Images Deployed:**
          - Frontend: \`${{ needs.build-images.outputs.frontend-image }}\`
          - Backend: \`${{ needs.build-images.outputs.backend-image }}\`
          
          **Deployment Status:** ✅ Success
          
          **Health Checks:** All services healthy
          
          **Rollback:** Available via previous image tags
          EOF

  # Cleanup old images (runs weekly)
  cleanup:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Delete old container images
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
              package_type: 'container',
              package_name: '${{ env.IMAGE_NAME_FRONTEND }}',
              org: context.repo.owner,
            });
            
            const versions = response.data;
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 30); // Keep last 30 days
            
            for (const version of versions) {
              if (new Date(version.created_at) < cutoff && !version.metadata.container.tags.includes('latest')) {
                await github.rest.packages.deletePackageVersionForOrg({
                  package_type: 'container',
                  package_name: '${{ env.IMAGE_NAME_FRONTEND }}',
                  org: context.repo.owner,
                  package_version_id: version.id,
                });
              }
            }